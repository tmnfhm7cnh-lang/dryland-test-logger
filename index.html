<!doctype html>
<html lang="es" data-app="dryland" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test seco">
<title>Registro de tests · seco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="tokens.css">
<style>
/* LOTE 4: these five now alias the shared tokens (tokens.css) instead of
   their own hex — chrome is unified across both apps. --warn/--bad stay
   local: they're this app's own semantic colours, not part of the shared
   al- palette, and churning them isn't worth the risk on a production app
   in front of real athletes this week. See design-system.md's dryland
   override block and ESTADO.md for the reasoning. */
:root{
  --bg:var(--al-bg); --panel:var(--al-surface-1); --panel2:var(--al-surface-2); --line:var(--al-line);
  --ink:var(--al-ink); --dim:var(--al-ink-muted); --accent:var(--al-ok); --warn:#f0b429; --bad:#e8615a;
  --radius:12px; --tap:52px;
}
*{box-sizing:border-box}
/* iOS zooms on a double tap, and a double tap is exactly what tapping + twice or
   stopping the watch looks like. manipulation drops that gesture and its 300 ms
   wait while leaving pinch-to-zoom alone, so the page can still be enlarged.
   touch-action is not inherited, so it goes on the root, on body and on every tap
   target rather than in one place. */
html,body,button,select,input,textarea,label,nav,.step,.watch,.pill{touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;
  /* tapping + fast otherwise selects the glyph and pops the magnifier */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent}

header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);
}
.topline{display:flex;gap:8px}
.topline select,.topline input{
  flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px;min-height:44px;
}
.banner{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:14px}
.banner.warn{background:#3b2f10;color:var(--warn);border:1px solid #6a5416}
.banner.bad{background:#3b1a1a;color:var(--bad);border:1px solid #6a2a2a}

main{padding:12px;max-width:820px;margin:0 auto}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
p.note{color:var(--dim);font-size:14px;margin:4px 0 12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:10px;width:100%;text-align:left;display:block}
.card.tap:active{background:var(--panel2)}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .sub{color:var(--dim);font-size:13px;margin-top:2px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:13px;white-space:nowrap}
.pill.ok{background:#12352c;border-color:#1d5b4a;color:var(--accent)}
.pill.blocked{background:#3b1a1a;border-color:#6a2a2a;color:var(--bad)}
.bar{height:4px;background:var(--panel2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;min-height:var(--tap);text-align:center;width:100%;margin-bottom:8px}
.btn.primary{background:var(--accent);color:#06231c;border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#6a2a2a}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-bottom:8px}

.athlete{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;margin-bottom:8px}
.athlete.done{border-color:#1d5b4a}
.athlete > .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.code{font-weight:700;letter-spacing:.04em}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.inputline{display:flex;gap:6px;align-items:stretch}
.inputline input{
  flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px;min-height:var(--tap);font-size:18px;text-align:center;
}
/* LOTE 4: :focus-visible only, so a tap doesn't leave a ring — this was the
   one focus rule in the whole app; it's now folded into the global one
   below, which also covers buttons, selects and the nav for the first time. */
.inputline input.invalid{border-color:var(--bad);background:#3b1a1a}
.inputline input.outrange{border-color:var(--warn);background:#3b2f10}
.step{width:46px;min-height:var(--tap);background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;font-size:22px;line-height:1}
.step:active{background:var(--line)}
.watch{width:56px;min-height:var(--tap);background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.watch.running{background:var(--bad);border-color:var(--bad);color:#fff}
.toggle{min-height:var(--tap);width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.toggle.on{background:#12352c;border-color:#1d5b4a;color:var(--accent);font-weight:600}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels button{flex:1;min-width:44px;min-height:var(--tap);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;font-size:17px}
.levels button.on{background:var(--accent);color:#06231c;font-weight:700}
.rubric{font-size:12px;color:var(--dim);margin-top:6px}
.asym{font-size:13px;margin-top:8px;color:var(--dim)}
.asym.high{color:var(--warn)}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:10px;min-height:44px;resize:vertical}
details{margin-top:8px}
summary{color:var(--dim);font-size:14px;padding:8px 0;cursor:pointer}

.criterion{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;
  padding:10px;font-size:14px;color:var(--dim);margin-bottom:12px}
.criterion.blocked{border-left-color:var(--bad)}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:10px 4px;font-size:12px;color:var(--dim);min-height:60px}
nav button.on{color:var(--accent)}
nav .ico{display:block;font-size:20px;line-height:1.2}
nav .badge{display:inline-block;background:var(--warn);color:#3b2f10;border-radius:999px;
  padding:0 6px;font-size:11px;font-weight:700;margin-left:4px}
.back{color:var(--dim);padding:8px 0;margin-bottom:4px}
pre.csv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;
  font-size:11px;overflow:auto;max-height:240px;white-space:pre}

/* Room clock: one clock the whole room reads, on a device nobody touches.
   A partner cannot produce a duration without a clock, so every hold test
   turns into a moment read off this screen. */
#clock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#clock.on{display:flex}
#clock .face{flex:1;width:100%;display:flex;align-items:center;justify-content:center;
  line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#clock .secs{font-size:min(46vw,58vh);font-weight:700;letter-spacing:-.03em}
#clock .tenths{font-size:min(14vw,18vh);font-weight:700;color:var(--accent);margin-left:.06em}
#clock.idle .secs{color:var(--dim)}
#clock .hint{color:var(--dim);font-size:15px;padding:0 16px 10px;text-align:center}
#clock .bar2{display:flex;gap:10px;padding:0 16px 16px;width:100%;max-width:520px}
#clock .bar2 button{flex:1;min-height:56px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);color:var(--ink);font-size:16px}

/* LOTE 4 §7: global focus ring, both apps' recipe. */
:where(button,[role="button"],a,input,select,textarea,summary):focus-visible{
  outline:2px solid var(--al-focus);outline-offset:2px;border-radius:inherit;
}
:focus:not(:focus-visible){outline:none}

/* LOTE 4 §5: emoji nav icons replaced with inline SVG, stroke:currentColor,
   so nav button.on{color:var(--accent)} recolours the icon too — emoji
   ignored that rule entirely. */
nav .ico svg{display:block;width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none}
</style>
</head>
<body>
<header>
  <div class="topline">
    <select id="group" aria-label="Grupo"></select>
    <input type="date" id="date" aria-label="Fecha">
  </div>
  <div id="banner"></div>
</header>

<main id="view"></main>

<div id="clock" class="idle">
  <div class="face" id="clockFace">
    <span class="secs" id="clockSecs">0</span><span class="tenths" id="clockTenths">.0</span>
  </div>
  <div class="hint">Toca el número para arrancar y parar. Nadie más toca esta pantalla.</div>
  <div class="bar2">
    <button type="button" id="clockZero">Poner a cero</button>
    <button type="button" id="clockExit">Salir</button>
  </div>
</div>

<nav id="tabs">
  <button data-tab="session" class="on">
    <span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg></span>
    Sesión
  </button>
  <button data-tab="athome">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg></span>
    En casa<span class="badge" id="badge" hidden></span>
  </button>
  <button data-tab="roster">
    <span class="ico"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"/></svg></span>
    Nadadoras
  </button>
  <button data-tab="export">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></span>
    Exportar
  </button>
</nav>

<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
